# See the configuration reference at https://symfony.com/bundles/SchebTwoFactorBundle/6.x/configuration.html
scheb_two_factor:
    security_tokens:
        - Symfony\Component\Security\Core\Authentication\Token\UsernamePasswordToken
        - Symfony\Component\Security\Http\Authenticator\Token\PostAuthenticationToken

    email:
        enabled: true # Si l'authentification par e-mail doit être activée, la valeur par défaut est false.
        digits: 6 # Nombre de chiffres du code d'authentification
        sender_email: no-reply@test.com # Adresse e-mail de l'expéditeur
        sender_name: John Doe # !! nom
        # mailer: acme.custom_mailer_service -- Utilisez un service alternatif pour envoyer le code d'authentification
        # code_generator: acme.custom_code_generator_service -- Utilisez un service alternatif pour générer le code d'authentification.
        # template: security/2fa_form.html.twig -- Modèle utilisé pour générer le formulaire d'authentification
        # form_renderer: acme.custom_form_renderer -- Utilisez un service de rendu de formulaire personnalisé

    trusted_device:
        enabled: true # Si la fonction d'appareil de confiance doit être activée
        lifetime: 5184000 # Durée de vie du jeton du périphérique de confiance
        # manager: acme.custom_trusted_device_manager # Utilisez un gestionnaire de périphériques de confiance personnalisé
        extend_lifetime: false # Prolonger automatiquement la durée de vie du cookie de confiance lors de la reconnexion
        # key: null # Clé de chiffrement pour le jeton JWT, doit comporter au moins 32 caractères. Si elle n'est pas définie, # le secret du noyau de l'application est utilisé.
        cookie_name: trusted_device    # Nom du cookie de l'appareil de confiance
        cookie_secure: false           # true|false|auto Set the 'Secure' (HTTPS Only) flag on the trusted device cookie (vrai|faux|auto Définir l'indicateur « Sécurisé » (HTTPS uniquement) sur le cookie de l'appareil de confiance)
        cookie_same_site: "lax"        # The same-site option of the cookie, can be "lax", "strict" or null (L'option same-site du cookie peut être « lax », « stricte » ou nulle.)
        # cookie_domain: ".example.com"  # Domaine à utiliser lors de la définition du cookie ; par défaut, le domaine de la requête sera utilisé.
        cookie_path: "/"               # Chemin à utiliser lors de la définition du cookie
