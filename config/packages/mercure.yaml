mercure:
    hubs:
        default:
            url: '%env(MERCURE_URL)%' # L'url du hub
            public_url: '%env(MERCURE_PUBLIC_URL)%' # --
            jwt:
                secret: '%env(MERCURE_JWT_SECRET)%' # Le token utilisé pour s'authentifier au près du hub pour publier dans 'Bearer'
                publish: '*'
