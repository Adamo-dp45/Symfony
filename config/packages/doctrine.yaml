doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
        # use_savepoints: true -- Supprimé (DoctrineBundle 3) : DBAL 4 utilise toujours les savepoints
    orm:
        # -- Supprimés avec DoctrineBundle 3 (Symfony 8) :
        # auto_generate_proxy_classes / enable_lazy_ghost_objects : les entités "proxy" sont maintenant
        #    des "native lazy objects" de PHP 8.4, plus besoin de générer des classes Proxy
        # report_fields_where_declared : comportement par défaut avec Doctrine ORM 3
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
        # controller_resolver: -- Supprimé : 'auto_mapping: false' est désormais le seul comportement possible
        #    auto_mapping: false   (utiliser #[MapEntity] ou les paramètres de route {id} explicites)

        # -- Dql functions
        dql:
            numeric_functions:
                ASIN: DoctrineExtensions\Query\Mysql\Asin # Le namespace de la class dans la documentation de 'beberlei/doctrineextensions'
                Power: DoctrineExtensions\Query\Mysql\Power
                SIN: DoctrineExtensions\Query\Mysql\Sin
                PI: DoctrineExtensions\Query\Mysql\Pi
                COS: DoctrineExtensions\Query\Mysql\Cos
            # string_functions:
            #    test_string: App\DQL\StringFunction
            #    second_string: App\DQL\SecondStringFunction
            # datetime_functions:
            #    test_datetime: App\DQL\DatetimeFunction

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            # auto_generate_proxy_classes / proxy_dir : supprimés (native lazy objects, voir plus haut)
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
